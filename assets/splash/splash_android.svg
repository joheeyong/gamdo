<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 288">
  <!-- 실행 화면 조리개 (Android). 288dp 캔버스 가운데에 지름 112dp 원.
       Android 12+ 시스템 스플래시 아이콘 규격(288dp, 보이는 원 192dp)에 맞추고,
       12 미만 launch_background도 같은 그림을 가운데에 놓아 위치가 같다.
       Flutter 스플래시(ApertureMark, 지름 112)가 이어받는다. -->
  <g transform="translate(54 54)"><circle cx="90" cy="90" r="56" fill="#7DD3FC"/><clipPath id="lens"><circle cx="90" cy="90" r="56"/></clipPath><g clip-path="url(#lens)" stroke="#111111" stroke-width="6" stroke-linecap="round" fill="none"><path d="M90.0 68.0L145.1 99.8 M109.1 79.0L109.1 142.7 M109.1 101.0L53.9 132.8 M90.0 112.0L34.9 80.2 M70.9 101.0L70.9 37.3 M70.9 79.0L126.1 47.2"/></g><circle cx="90" cy="90" r="56" fill="none" stroke="#111111" stroke-width="2"/><polygon points="90.0,68.0 109.1,79.0 109.1,101.0 90.0,112.0 70.9,101.0 70.9,79.0" fill="#111111"/></g>
</svg>
