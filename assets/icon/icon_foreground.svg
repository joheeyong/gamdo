<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Android 적응형 아이콘 앞면. 바탕(#111111)은 별도 색으로 지정한다.
       flutter_launcher_icons가 앞면 둘레에 16% 여백을 넣어 보이는 영역(72/108)에
       맞추므로, 여기서는 아이콘 원본과 같은 180 좌표로 그린다. -->
  <circle cx="90" cy="90" r="56" fill="#D4FF3F"/><g stroke="#111111" stroke-width="6" stroke-linecap="round" fill="none"><path d="M90.0 68.0L145.1 99.8 M109.1 79.0L109.1 142.7 M109.1 101.0L53.9 132.8 M90.0 112.0L34.9 80.2 M70.9 101.0L70.9 37.3 M70.9 79.0L126.1 47.2"/></g><circle cx="90" cy="90" r="56" fill="none" stroke="#111111" stroke-width="2"/><polygon points="90.0,68.0 109.1,79.0 109.1,101.0 90.0,112.0 70.9,101.0 70.9,79.0" fill="#111111"/>
</svg>
