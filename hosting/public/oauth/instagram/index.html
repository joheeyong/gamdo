<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>감도로 돌아가는 중</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
       background:#F1F4F7;color:#111}
  main{text-align:center;padding:24px}
  a{display:inline-block;margin-top:16px;padding:14px 22px;border-radius:999px;background:#111;color:#fff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main>
  <p>감도 앱으로 돌아가는 중이에요…</p>
  <a id="open" href="#">감도 열기</a>
</main>
<script>
  // Instagram OAuth redirect_uri. 받은 code·state(또는 error)를 그대로 앱 스킴으로 넘긴다.
  // 서버를 거치지 않으므로 Mac·ngrok 상태와 무관하게 동작한다.
  var params = new URLSearchParams(window.location.search);
  var forward = new URLSearchParams();
  ["code", "state", "error", "error_reason", "error_description"].forEach(function (k) {
    var v = params.get(k);
    if (v) forward.set(k, v.replace(/#_$/, ""));
  });
  var target = "gamdo://oauth/instagram?" + forward.toString();
  document.getElementById("open").href = target;
  window.location.replace(target);
</script>
</body>
</html>
